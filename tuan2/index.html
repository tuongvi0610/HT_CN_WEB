<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Tuần 2</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fef3c7, #fef9c3);
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 30px;
      }
      h1 {
        text-align: center;
        color: #b45309;
        margin-bottom: 30px;
      }
      .list {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .item {
        flex: 1 1 300px;
        max-width: 360px;
        border: 1px solid #fcd34d;
        border-radius: 12px;
        background: #fffdf2;
        padding: 24px 20px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
      }
      a {
        display: inline-block;
        text-decoration: none;
        color: #fff;
        background: #f59e0b;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 1.05rem;
        font-weight: bold;
        transition: 0.2s ease;
      }
      a:hover {
        background: #d97706;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Danh sách bài tập Tuần 2</h1>

      <div class="list">
        <div class="item">
          <a href="Bai1/bai1.html">Bài 1</a>
        </div>

        <div class="item">
          <a href="Bai2/bai2.html">Bài 2</a>
        </div>
      </div>
    </div>
  </body>
</html>
