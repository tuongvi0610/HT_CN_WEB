<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    body {
      /* background-color: #87CEFA; */
      font-family: Arial, sans-serif;
    }
    .container {
      width: 600px;
      margin: 20px auto;
      background: #87CEFA;
      padding: 20px;
      border: 1px solid #000;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      width: 300px;
      height: 80px;
    }
    h2 {
      text-align: center;
    }
    table {
      width: 100%;
    }
    td {
      padding: 5px;
      vertical-align: top;
    }
    input[type="text"], select, textarea {
      width: 90%;
      padding: 4px;
    }
    textarea {
      height: 80px;
    }
    .buttons {
      text-align: center;
      margin-top: 10px;
    }
    .buttons input {
      padding: 6px 12px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="" alt="Jackson Electronics">
    </div>
    <h2>Registration Form</h2>
    <form>
      <table>
        <tr>
          <td>First Name:</td>
          <td><input type="text"></td>
          <td>Last Name:</td>
          <td><input type="text"></td>
        </tr>
        <tr>
          <td>Address #1:</td>
          <td colspan="3"><input type="text" style="width:98%"></td>
        </tr>
        <tr>
          <td>Address #2:</td>
          <td colspan="3"><input type="text" style="width:98%"></td>
        </tr>
        <tr>
          <td>City:</td>
          <td><input type="text"></td>
          <td>State:</td>
          <td><input type="text" style="width:60px"> Zip: <input type="text" style="width:60px"></td>
        </tr>
        <tr>
          <td>Country:</td>
          <td colspan="3">
            <select>
              <option>United States</option>
              <option>Vietnam</option>
              <option>Japan</option>
            </select>
          </td>
        </tr>
      </table>
      <hr>
      <table>
        <tr>
          <td>Product:</td>
          <td><select><option>ScanMaster</option></select></td>
        </tr>
        <tr>
          <td>Date Purchased:</td>
          <td><input type="text"></td>
        </tr>
        <tr>
          <td>Serial #:</td>
          <td><input type="text"></td>
        </tr>
        <tr>
          <td>Used for:</td>
          <td colspan="3">
            <input type="radio" name="use"> Home
            <input type="radio" name="use"> Business
            <input type="radio" name="use"> Government
            <input type="radio" name="use"> Educational Institution
            <input type="radio" name="use"> Other
          </td>
        </tr>
        <tr>
          <td>System (check all that apply):</td>
          <td colspan="3">
            <input type="checkbox"> Windows
            <input type="checkbox"> Macintosh
            <input type="checkbox"> UNIX
            <input type="checkbox"> Other
          </td>
        </tr>
      </table>
      <hr>
      <table>
        <tr>
          <td>Comments?</td>
          <td colspan="3"><textarea></textarea></td>
        </tr>
      </table>
      <div class="buttons">
        <input type="submit" value="Click to register">
        <input type="reset" value="Click to cancel">
      </div>
    </form>
  </div>
</body>
</html>
